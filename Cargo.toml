[workspace]
members = [
    "alacritty_status",
    "alacritty",
    "alacritty_terminal",
    "alacritty_config",
    "alacritty_config_derive",
]
exclude = ["vendor/vte"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85.0"

[profile.release]
lto = "thin"
debug = 1
incremental = false

[workspace.dependencies]
toml = "0.9.11"
toml_edit = "0.24.0"

[patch.crates-io]
vte = { path = "vendor/vte" }
winit = { git = "https://github.com/shanghaikid/winit.git", rev = "c73f0893b0f3d4e2bb6231d94e742434f36d330c" }
