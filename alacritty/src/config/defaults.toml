# Compiled into this fork; no user configuration file is needed.
# Keep keyboard bindings in bindings.rs so user bindings can replace defaults.
[general]
live_config_reload = true

[window]
padding = { x = 12, y = 24 }
dynamic_padding = true
startup_mode = "Maximized"
opacity = 1.0
blur = false

[font]
size = 11.0

[colors.primary]
background = "#1a1b26"
foreground = "#c0caf5"

[colors.cursor]
cursor = "#7aa2f7"
text = "#1a1b26"

[colors.selection]
background = "#283457"
text = "#c0caf5"

[colors.normal]
black = "#15161e"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"

[colors.bright]
black = "#414868"
red = "#ff899d"
green = "#9fe044"
yellow = "#faba4a"
blue = "#8db0ff"
magenta = "#c7a9ff"
cyan = "#a4daff"
white = "#c0caf5"

[cursor]
style = { shape = "Block", blinking = "Never" }

[scrolling]
history = 100000

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true
