# macOS additions to defaults.toml; matches Rex Beta terminal typography.
[terminal]
grapheme_clusters = true

[window]
decorations = "Transparent"
decorations_theme_variant = "Light"
option_as_alt = "Both"

[font]
normal = { family = "Menlo", style = "Regular" }
bold = { style = "Bold" }
italic = { style = "Italic" }
bold_italic = { style = "Bold Italic" }

[keyboard.global_hotkey]
enabled = true
key = "KeyL"
mods = "Command|Shift"
