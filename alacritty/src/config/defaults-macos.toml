# macOS additions to defaults.toml; fonts are included in Alacritty.app.
[terminal]
grapheme_clusters = true

[window]
decorations = "Transparent"
option_as_alt = "Both"

[font]
normal = { family = "JetBrainsMono Nerd Font Mono", style = "Light" }
bold = { style = "Regular" }
italic = { style = "Light Italic" }
bold_italic = { style = "Italic" }

[keyboard.global_hotkey]
enabled = true
key = "KeyL"
mods = "Command|Shift"
