# Formatting top_line_time calls localtime/strftime on every scroll update.
# On macOS these repeatedly load timezone files. Keep position and search
# feedback without putting timezone I/O on the mouse input path.
# Older dotfiles-based tmux versions may not have this option; -q skips it.
set -gq copy-mode-position-format '#[align=right][#{copy_position}/#{copy_position_limit}]#{?search_timed_out, (timed out),#{?search_count, (#{search_count}#{?search_count_partial,+,} results),}}'
