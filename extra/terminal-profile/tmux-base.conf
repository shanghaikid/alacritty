# Alacritty / Ghostty-style splits and tabs. Prefix remains Ctrl-B.
set -g prefix C-b
set -g default-terminal "tmux-256color"
set -as terminal-features ',alacritty*:RGB,xterm-ghostty:RGB'
set -g default-shell /bin/zsh
set -g history-limit 100000
# Alacritty and tmux run locally: do not wait to disambiguate Escape.
set -sg escape-time 0
# Each Command shortcut already sends the prefix. Return to typing immediately.
set -g repeat-time 0
# Avoid focus-triggered TUI refreshes when returning from another app.
set -g focus-events off
set -g mouse on
set -g set-clipboard external
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

# Short tab labels follow the active pane, including while a TUI is running.
setw -g allow-rename off
setw -g automatic-rename on
@TAB_LABEL@
# Show a directory immediately while the first asynchronous Git query finishes.
setw -g automatic-rename-format '#{?#{E:@tab-label},#{E:@tab-label},#{b:pane_current_path}}'

# Splits and tabs inherit the current pane's working directory.
bind % split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r C-Left resize-pane -L 5
bind -r C-Right resize-pane -R 5
bind -r C-Up resize-pane -U 5
bind -r C-Down resize-pane -D 5


# Trackpad events are frequent: avoid five per-line scroll operations per event.
# Keep selecting the pane under the mouse, and leave application mouse input alone.
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
bind -T copy-mode WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode WheelDownPane select-pane \; send-keys -X -N 1 scroll-down

# Mouse selection and vi-mode copying use the macOS clipboard.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'

# Merino tab layout; colors are supplied by the shared appearance profile.
set -g status-position top
set -g status-justify left
set -g status-left ''
set -g status-interval 5
setw -g window-status-separator ' '
setw -g window-status-format '  #I  #{?pane_program_status,#{pane_program_status} ,}#{?#{E:@tab-label},#{E:@tab-label},#{b:pane_current_path}}  '
setw -g window-status-current-format '  #I  #{?pane_program_status,#{pane_program_status} ,}#{?#{E:@tab-label},#{E:@tab-label},#{b:pane_current_path}}  '
