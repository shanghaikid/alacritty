# iTerm2-derived colors for the Alacritty tmux server.
# Load after the shared tmux configuration; bindings/layout stay in that file.
set -g status-style 'none,bg=#252525,fg=#e3f1e4'
set -g status-right '#[fg=#c8b8a9] %H:%M '
setw -g window-status-style 'none,fg=#c8b8a9,bg=#252525'
setw -g window-status-current-style 'none,fg=#ffffff,bg=#606060'
setw -g window-status-activity-style 'none,fg=#eebb6e,bg=#252525'
setw -g window-status-bell-style 'none,fg=#d8726f,bg=#252525'
setw -g window-status-last-style 'none,fg=#c8b8a9,bg=#252525'
set -g pane-border-style 'fg=#606060'
set -g pane-active-border-style 'fg=#e9c9f2'
set -g message-style 'none,fg=#ffffff,bg=#606060'
set -g message-command-style 'none,fg=#ffffff,bg=#606060'
setw -g mode-style 'none,fg=#ffffff,bg=#606060'
setw -g clock-mode-colour '#c8b8a9'
