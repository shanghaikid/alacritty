# Merino Light: Rex terminal and interface colors.
# Keep bindings, tab labels, and layout from the shared configuration.
# Older tmux versions lack automatic theme detection; explicit styles still apply.
set -sq theme light
set -g status-style 'none,bg=#eceef2,fg=#696d71'
set -g status-right '#[fg=#696d71] %H:%M '
set -g status-left-style 'none,bg=#eceef2,fg=#696d71'
set -g status-right-style 'none,bg=#eceef2,fg=#696d71'
setw -g window-status-style 'none,fg=#696d71,bg=#eceef2'
setw -g window-status-current-style 'none,fg=#1f2328,bg=#ffffff'
setw -g window-status-activity-style 'none,fg=#0969da,bg=#eceef2'
setw -g window-status-bell-style 'none,fg=#cf222e,bg=#eceef2'
setw -g window-status-last-style 'none,fg=#696d71,bg=#eceef2'
set -g pane-border-style 'fg=#e7e9eb,bg=#ffffff'
set -g pane-active-border-style 'fg=#0969da,bg=#ffffff'
set -g message-style 'none,fg=#1f2328,bg=#eceef2'
set -g message-command-style 'none,fg=#1f2328,bg=#eceef2'
setw -g mode-style 'none,fg=#1f2328,bg=#e6effc'
setw -g clock-mode-colour '#0969da'
setw -g menu-style 'none,fg=#1f2328,bg=#f8f9fb'
setw -g menu-selected-style 'none,fg=#0969da,bg=#e6effc'
setw -g menu-border-style 'fg=#d1d2d5,bg=#f8f9fb'
setw -g popup-style 'none,fg=#1f2328,bg=#ffffff'
setw -g popup-border-style 'fg=#d1d2d5,bg=#ffffff'
# Explicit defaults make OSC 10/11 probes see the light theme even on older clients.
setw -g window-style 'fg=#1f2328,bg=#ffffff'
setw -g window-active-style 'fg=#1f2328,bg=#ffffff'
