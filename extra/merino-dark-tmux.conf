# Merino Dark: Rex terminal and interface colors.
# Keep bindings, tab labels, and layout from the shared configuration.
# Older tmux versions lack automatic theme detection; explicit styles still apply.
set -sq theme dark
set -g status-style 'none,bg=#131519,fg=#82878c'
set -g status-right '#[fg=#82878c] %H:%M '
set -g status-left-style 'none,bg=#131519,fg=#82878c'
set -g status-right-style 'none,bg=#131519,fg=#82878c'
setw -g window-status-style 'none,fg=#82878c,bg=#131519'
setw -g window-status-current-style 'none,fg=#e6edf3,bg=#0d1117'
setw -g window-status-activity-style 'none,fg=#2f81f7,bg=#131519'
setw -g window-status-bell-style 'none,fg=#ff7b72,bg=#131519'
setw -g window-status-last-style 'none,fg=#82878c,bg=#131519'
set -g pane-border-style 'fg=#2e3135,bg=#0d1117'
set -g pane-active-border-style 'fg=#2f81f7,bg=#0d1117'
set -g message-style 'none,fg=#e6edf3,bg=#131519'
set -g message-command-style 'none,fg=#e6edf3,bg=#131519'
setw -g mode-style 'none,fg=#e6edf3,bg=#142134'
setw -g clock-mode-colour '#2f81f7'
setw -g menu-style 'none,fg=#e6edf3,bg=#1e2023'
setw -g menu-selected-style 'none,fg=#2f81f7,bg=#142134'
setw -g menu-border-style 'fg=#424549,bg=#1e2023'
setw -g popup-style 'none,fg=#e6edf3,bg=#0d1117'
setw -g popup-border-style 'fg=#424549,bg=#0d1117'
# Explicit defaults make OSC 10/11 probes see the dark theme even on older clients.
setw -g window-style 'fg=#e6edf3,bg=#0d1117'
setw -g window-active-style 'fg=#e6edf3,bg=#0d1117'
