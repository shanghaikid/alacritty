# Use with Alacritty [mouse] shift_passthrough = true.
# Keep split mouse/Alt escape sequences together across PTY reads. Complete
# sequences are processed immediately; incomplete escape sequences can wait.
set -sg escape-time 20
# Keep the selection after releasing the mouse, so scrolling can find the endpoint.
bind -T copy-mode-vi MouseDragEnd1Pane { send -X stop-selection; send -X copy-pipe-no-clear 'pbcopy' }
bind -T copy-mode MouseDragEnd1Pane { send -X stop-selection; send -X copy-pipe-no-clear 'pbcopy' }

# Capture copy_position before other-end can move the viewport. run -C retains
# the original mouse event; goto-line restores the viewport and rectangle-off
# updates the active endpoint at that event's cell. Freeze again before copying.
# copy_position also handles tmux's absolute line-number mode.
bind -T copy-mode-vi S-MouseDown1Pane if -F '#{!=:#{selection_start_y},}' { run -C 'send -X other-end; send -X goto-line #{copy_position}; send -X rectangle-off; send -X stop-selection; send -X copy-pipe-no-clear pbcopy' } { send -X stop-selection; send-keys User999 }
bind -T copy-mode S-MouseDown1Pane if -F '#{!=:#{selection_start_y},}' { run -C 'send -X other-end; send -X goto-line #{copy_position}; send -X rectangle-off; send -X stop-selection; send -X copy-pipe-no-clear pbcopy' } { send -X stop-selection; send-keys User999 }

# Word/line selection must also survive releasing the mouse.
bind -T copy-mode-vi DoubleClick1Pane { select-pane; send -X select-word; send -X stop-selection; send -X copy-pipe-no-clear 'pbcopy' }
bind -T copy-mode-vi TripleClick1Pane { select-pane; send -X select-line; send -X stop-selection; send -X copy-pipe-no-clear 'pbcopy' }
bind -T copy-mode-vi S-DoubleClick1Pane if -F '#{!=:#{selection_start_y},}' { run -C 'send -X other-end; send -X goto-line #{copy_position}; send -X rectangle-off; send -X stop-selection; send -X copy-pipe-no-clear pbcopy' } { send -X stop-selection; send-keys User999 }
bind -T copy-mode-vi S-TripleClick1Pane if -F '#{!=:#{selection_start_y},}' { run -C 'send -X other-end; send -X goto-line #{copy_position}; send -X rectangle-off; send -X stop-selection; send -X copy-pipe-no-clear pbcopy' } { send -X stop-selection; send-keys User999 }
bind -T copy-mode DoubleClick1Pane { select-pane; send -X select-word; send -X stop-selection; send -X copy-pipe-no-clear 'pbcopy' }
bind -T copy-mode TripleClick1Pane { select-pane; send -X select-line; send -X stop-selection; send -X copy-pipe-no-clear 'pbcopy' }
bind -T copy-mode S-DoubleClick1Pane if -F '#{!=:#{selection_start_y},}' { run -C 'send -X other-end; send -X goto-line #{copy_position}; send -X rectangle-off; send -X stop-selection; send -X copy-pipe-no-clear pbcopy' } { send -X stop-selection; send-keys User999 }
bind -T copy-mode S-TripleClick1Pane if -F '#{!=:#{selection_start_y},}' { run -C 'send -X other-end; send -X goto-line #{copy_position}; send -X rectangle-off; send -X stop-selection; send -X copy-pipe-no-clear pbcopy' } { send -X stop-selection; send-keys User999 }

# Preserve word/line selections started outside copy mode, including mouse-aware TUIs.
bind -n DoubleClick1Pane { select-pane -t=; copy-mode -H; send -X select-word; send -X stop-selection; send -X copy-pipe-no-clear 'pbcopy' }
bind -n TripleClick1Pane { select-pane -t=; copy-mode -H; send -X select-line; send -X stop-selection; send -X copy-pipe-no-clear 'pbcopy' }

# Keep scrolling available while Shift is held to locate the next endpoint.
bind -T copy-mode-vi S-WheelUpPane { select-pane; send -X -N 1 scroll-up }
bind -T copy-mode-vi S-WheelDownPane { select-pane; send -X -N 1 scroll-down }
bind -T copy-mode S-WheelUpPane { select-pane; send -X -N 1 scroll-up }
bind -T copy-mode S-WheelDownPane { select-pane; send -X -N 1 scroll-down }

# Without an anchor, a single click establishes one (no initial drag needed).
# With an anchor, including an empty one, a plain click returns to the application.
# It forwards the
# click, so input fields work immediately. Shift-click still extends selection.
bind -T copy-mode-vi MouseDown1Pane { select-pane; if -F '#{!=:#{selection_start_y},}' { send -X cancel; send -M } { send -X stop-selection; send-keys User999 } }
bind -T copy-mode MouseDown1Pane { select-pane; if -F '#{!=:#{selection_start_y},}' { send -X cancel; send -M } { send -X stop-selection; send-keys User999 } }
# Plain clicks always select, even when the application has requested mouse input.
bind -n MouseDown1Pane { select-pane -t=; copy-mode -H; send -X stop-selection; send-keys User999 }

# Dispatch without a mouse event: begin-selection otherwise uses the previous
# drag coordinate, rather than the cell where the initial click landed.
bind -T copy-mode-vi User999 { send -X begin-selection; send -X stop-selection; set -p @alacritty_mouse_anchor 1 }
bind -T copy-mode User999 { send -X begin-selection; send -X stop-selection; set -p @alacritty_mouse_anchor 1 }
# A fresh drag moves its end, not the start of the empty single-click anchor.
bind -T copy-mode-vi MouseDrag1Pane { select-pane; send -X clear-selection; send -X begin-selection }
bind -T copy-mode MouseDrag1Pane { select-pane; send -X clear-selection; send -X begin-selection }

# Option (Meta) passes clicks and drags through to the application. Leave copy
# mode first so the same gesture works immediately after selecting text.
# Override tmux's default Meta-drag binding, which would move the pane.
bind -n M-MouseDown1Pane { select-pane -t=; send -M }
bind -n M-MouseUp1Pane send -M
bind -n M-MouseDrag1Pane send -M
bind -n M-MouseDragEnd1Pane send -M
bind -n M-DoubleClick1Pane send -M
bind -n M-TripleClick1Pane send -M
bind -T copy-mode-vi M-MouseDown1Pane { send -X cancel; send -M }
bind -T copy-mode M-MouseDown1Pane { send -X cancel; send -M }

# A mouse anchor is temporary: typing cancels it and delivers the original key.
# Reset the marker whenever copy mode is explicitly entered, so normal keyboard
# copy-mode commands retain their existing bindings.
set-hook -g after-copy-mode[901] 'set -pu @alacritty_mouse_anchor'
run-shell 'python3 ~/.config/alacritty/tmux-mouse-anchor-input.py ~/.local/bin/tmux "#{socket_path}"'
