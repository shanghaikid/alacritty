# Use with Alacritty [mouse] shift_passthrough = true.
# Keep the selection after releasing the mouse, so scrolling can find the endpoint.
bind -T copy-mode-vi MouseDragEnd1Pane { send -X stop-selection; send -X copy-pipe-no-clear 'pbcopy' }
bind -T copy-mode MouseDragEnd1Pane { send -X stop-selection; send -X copy-pipe-no-clear 'pbcopy' }

# Capture copy_position before other-end can move the viewport. run -C retains
# the original mouse event; goto-line restores the viewport and rectangle-off
# updates the active endpoint at that event's cell. Freeze again before copying.
# copy_position also handles tmux's absolute line-number mode.
bind -T copy-mode-vi S-MouseDown1Pane if -F '#{selection_present}' { run -C 'send -X other-end; send -X goto-line #{copy_position}; send -X rectangle-off; send -X stop-selection; send -X copy-pipe-no-clear pbcopy' } { send -X begin-selection }
bind -T copy-mode S-MouseDown1Pane if -F '#{selection_present}' { run -C 'send -X other-end; send -X goto-line #{copy_position}; send -X rectangle-off; send -X stop-selection; send -X copy-pipe-no-clear pbcopy' } { send -X begin-selection }

# Word/line selection must also survive releasing the mouse.
bind -T copy-mode-vi DoubleClick1Pane { select-pane; send -X select-word; send -X stop-selection; send -X copy-pipe-no-clear 'pbcopy' }
bind -T copy-mode-vi TripleClick1Pane { select-pane; send -X select-line; send -X stop-selection; send -X copy-pipe-no-clear 'pbcopy' }
bind -T copy-mode-vi S-DoubleClick1Pane if -F '#{selection_present}' { run -C 'send -X other-end; send -X goto-line #{copy_position}; send -X rectangle-off; send -X stop-selection; send -X copy-pipe-no-clear pbcopy' } { send -X begin-selection }
bind -T copy-mode-vi S-TripleClick1Pane if -F '#{selection_present}' { run -C 'send -X other-end; send -X goto-line #{copy_position}; send -X rectangle-off; send -X stop-selection; send -X copy-pipe-no-clear pbcopy' } { send -X begin-selection }
bind -T copy-mode DoubleClick1Pane { select-pane; send -X select-word; send -X stop-selection; send -X copy-pipe-no-clear 'pbcopy' }
bind -T copy-mode TripleClick1Pane { select-pane; send -X select-line; send -X stop-selection; send -X copy-pipe-no-clear 'pbcopy' }
bind -T copy-mode S-DoubleClick1Pane if -F '#{selection_present}' { run -C 'send -X other-end; send -X goto-line #{copy_position}; send -X rectangle-off; send -X stop-selection; send -X copy-pipe-no-clear pbcopy' } { send -X begin-selection }
bind -T copy-mode S-TripleClick1Pane if -F '#{selection_present}' { run -C 'send -X other-end; send -X goto-line #{copy_position}; send -X rectangle-off; send -X stop-selection; send -X copy-pipe-no-clear pbcopy' } { send -X begin-selection }
