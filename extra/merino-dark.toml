# Merino Dark, from Rex Beta bundled themes.json (merino-dark).
# Source sRGB terminal palette; interface accents follow its CSS semantic colors.
[window]
decorations_theme_variant = "Dark"

[colors]
draw_bold_text_with_bright_colors = false
indexed_colors = []

[colors.primary]
background = "#0d1117"
foreground = "#e6edf3"
dim_foreground = "#6e7681"
bright_foreground = "#ffffff"

[colors.cursor]
text = "#eff8ff"
cursor = "#2f81f7"

[colors.vi_mode_cursor]
text = "#0d1117"
cursor = "#bc8cff"

[colors.search.matches]
foreground = "#0d1117"
background = "#d29922"

[colors.search.focused_match]
foreground = "#0d1117"
background = "#58a6ff"

[colors.footer_bar]
foreground = "#e6edf3"
background = "#131519"

[colors.hints.start]
foreground = "#0d1117"
background = "#d29922"

[colors.hints.end]
foreground = "#0d1117"
background = "#b1bac4"

[colors.selection]
text = "#0d1117"
background = "#e6edf3"

[colors.normal]
black = "#484f58"
red = "#ff7b72"
green = "#3fb950"
yellow = "#d29922"
blue = "#58a6ff"
magenta = "#bc8cff"
cyan = "#39c5cf"
white = "#b1bac4"

[colors.bright]
black = "#6e7681"
red = "#ffa198"
green = "#56d364"
yellow = "#e3b341"
blue = "#79c0ff"
magenta = "#d2a8ff"
cyan = "#56d4dd"
white = "#ffffff"
